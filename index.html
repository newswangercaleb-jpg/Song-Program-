<!DOCTYPE html>
<html>
<body>

<h1>Songs</h1>
<button onclick="openSong()">Amazing Grace</button>

<script>

function openSong() {
    document.body.innerHTML = "<h1>Amazing Grace</h1>";
    let newText = document.createElement("p");
    newText.textContent = "Amazing Grace how sweet the sound. That saved a wretch like me. I once was lost but now I'm found. Was blind, but now I see.";
    document.body.appendChild(newText);   
   
    let newButton = document.createElement("button");
    document.body.appendChild(newButton);
    newButton.textContent = "Back";
    newButton.onclick= back;
} 

function back() {
    document.body.innerHTML = "<h1>Songs</h1>";
    
    let newButton = document.createElement("button");
    newButton.textContent = "Amazing Grace";
    newButton.onclick= openSong;
    document.body.appendChild(newButton);
}
    
</script>

</body>
</html>
